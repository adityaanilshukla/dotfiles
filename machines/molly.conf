# molly — work MacBook.

# Nudges the cursor a pixel and back every two minutes so Teams and Slack read
# this machine as present rather than away. On here and nowhere else: this is
# the machine whose presence is being reported to someone.
mouse_jiggle = yes

# A second Claude Code account lives on this machine, in ~/.claude-work, reached
# with `claude-work`. The flag is what makes install.d/75-claude.sh maintain that
# profile's settings.json -- the sudo guard and, the part that actually bit, the
# renderer pin that keeps tmux scrollback working. On here and nowhere else: this
# is the machine with a work login.
claude_work_profile = yes
