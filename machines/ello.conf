# ello — personal MacBook.

# Nudges the cursor a pixel and back every two minutes, same as molly. This
# machine had no reason to care how idle it looked until it became the one
# carrying presence when molly is shut.
#
# Teams reports presence from whichever device was active most recently, so a
# locked molly reads Away and a sleeping one reads Offline, and presence falls
# through to this machine. Without the jiggler here that fallthrough lands on a
# machine that goes Away itself five minutes later.
#
# What actually has to hold is that the display never sleeps. pmset here says
# `sleep 1` on both power sources, which is shorter than the 120s jiggle
# interval and would win the race -- except displaysleep is 0, which keeps
# powerd's "Prevent sleep while display is on" assertion up, and that is what
# holds idle sleep off. Measured on battery rather than assumed: `pmset -g`
# reads `sleep 1 (sleep prevented by powerd, sharingd)`.
#
# A closed lid sleeps regardless of any of that, so this machine's lid stays
# open. See machines/molly.conf for the machine this was first written for.
mouse_jiggle = yes
