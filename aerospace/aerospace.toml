# =========================
# AeroSpace i3-style config
# =========================

start-at-login = true

# Use alt as mod (closest to i3 mod key feel)
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

# Both OFF so that `split` works, which is what makes alt-v behave like i3's
# mod+v: mark the focused window, and the NEXT window opened lands below it,
# leaving its siblings alone.
#
# i3 implements that by wrapping the focused window in a new container. So does
# AeroSpace, but by default it then tidies the tree and deletes any container
# holding a single child, which is exactly the container `split` just made. The
# command knows this and refuses outright:
#
#   'split' has no effect when 'enable-normalization-flatten-containers'
#   normalization enabled. My recommendation: keep the normalizations enabled,
#   and prefer 'join-with' over 'split'.
#
# Overriding that recommendation deliberately. join-with is the AeroSpace way
# and is still bound (alt-shift-v / alt-shift-b), but it is a different gesture:
# open the window first, then pull it into place. The i3 gesture is to declare
# the direction first, and that is the muscle memory being kept.
#
# What it costs: a container can outlive its contents. Close the window you
# split away and the now single-child container stays, so the next window opens
# into it rather than beside. That is i3's behaviour too, so it should feel
# familiar rather than broken. `aerospace flatten-workspace-tree` resets a
# workspace whose tree has got away from you.
#
# The second normalization force-flips nested containers to the opposite
# orientation of their parent. Harmless on its own, but it would silently
# override an explicit `split horizontal` inside a horizontal parent. i3 does no
# such forcing, so it goes too.
enable-normalization-flatten-containers = false
enable-normalization-opposite-orientation-for-nested-containers = false

# Open default apps on their starting workspaces once, at AeroSpace startup.
# Soft placement — after launch, windows can be moved anywhere freely.
after-startup-command = [
  'exec-and-forget open -a BetterDisplay',
  'exec-and-forget /Users/aditya/.config/aerospace/startup.sh',
]

# Notify sketchybar whenever the focused workspace changes so the bar's
# workspace indicator stays in sync.
exec-on-workspace-change = ['/bin/bash', '-c',
    'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE'
]

# Reserve space at the top so tiled windows sit below the 37pt sketchybar.
# Per-monitor: built-in gets 5 (macOS already reserves ~24pt for the menubar
# in the notch area), external monitors get the full 37pt.
[gaps]
outer.top = [{ monitor.'built-in Retina Display' = 5 }, { monitor.'DELL S3423DWC' = 37 }, 37]
outer.bottom = 0
outer.left = 0
outer.right = 0
inner.horizontal = 0
inner.vertical = 0

# ---------- Keybindings ----------
[key-mapping]
preset = 'qwerty'

[mode.main.binding]

# Focus windows. Same four keys as the i3 config on brovo, which does not use
# hjkl: the home row runs j-k-l-semicolon and the directions are laid over it as
# left-right-up-down.
alt-j = 'focus left'
alt-k = 'focus right'
alt-l = 'focus up'
alt-semicolon = 'focus down'

# i3 also binds mod+arrows for the same four. Only the vertical pair is mirrored
# here, and the omission is deliberate rather than an oversight.
#
# karabiner/spec.json rewrites ctrl+arrow into OPTION+arrow for word navigation,
# with shift carried through. AeroSpace bindings are global and consume the
# chord, so alt-left or alt-right here would silently eat word navigation in
# every GUI app. Option+Up and Option+Down are emitted by nothing, so they are
# free to take.
#
# They do cost paragraph motion in macOS text fields, which is what Option+Up
# and Option+Down natively do. Judged worth it: without vertical focus a window
# split below with alt-v cannot be reached at all.
alt-down = 'focus down'
alt-up = 'focus up'

alt-r = 'mode resize'

# Reload config 
alt-ctrl-r = 'reload-config'

# Take a screenshot and put it in the clipboard
alt-shift-s = 'exec-and-forget screencapture -i -c'

# Move windows. Shift over the same four letters, as in i3. Arrows again only
# vertical, for the word-selection reason above: ctrl+shift+arrow becomes
# option+shift+arrow, so alt-shift-left here would eat select-by-word.
alt-shift-j = 'move left'
alt-shift-k = 'move right'
alt-shift-l = 'move up'
alt-shift-semicolon = 'move down'
alt-shift-down = 'move down'
alt-shift-up = 'move up'

# Resize (optional but nice)
alt-ctrl-h = 'resize width -50'
alt-ctrl-l = 'resize width +50'
alt-ctrl-j = 'resize height +50'
alt-ctrl-k = 'resize height -50'

# Split direction, exactly i3's mod+h and mod+v. These declare where the NEXT
# window goes: alt-v then open something and it lands below the focused window,
# alt-h and it lands beside. Siblings are untouched, which is the whole point.
# Needs the normalizations disabled at the top of this file.
alt-h = 'split horizontal'
alt-v = 'split vertical'

# Container layouts, i3's mod+s and mod+w. AeroSpace has no stacking or tabbed
# layout by those names; accordion is the equivalent idea, where the focused
# window takes the space and its siblings collapse to slivers. Vertical
# accordion reads as i3 stacking, horizontal as tabbed. There are no title bars
# on the collapsed windows, which is the one real difference.
alt-s = 'layout v_accordion'
alt-w = 'layout h_accordion'

# i3 has mod+e for `layout toggle split`. NOT bound here, deliberately.
# Option+E is the edit-message chord for ~/Projects/tampermonkey/claude/claude.js
# on claude.ai, and karabiner/spec.json routes the Glove80's Alt key to it too.
# An AeroSpace binding is global and would consume the chord before the browser
# ever saw it. Put it on alt-shift-e if you want it:
#   alt-shift-e = 'layout tiles horizontal vertical'
#
# i3's mod+a (focus parent) has no equivalent at all. AeroSpace does not expose
# focus on containers, only on windows.

# i3's mod+Shift+space. Its mod+space (focus mode_toggle, jump between the
# tiling and floating sets) has no AeroSpace equivalent and is not bound.
alt-shift-space = 'layout floating tiling'

# join-with is the AeroSpace-native alternative to split and works the other way
# round: the window already exists, and this pulls it under a shared parent with
# its neighbour. No i3 counterpart, kept because it is the better tool when you
# did not think about layout until after opening the window.
alt-shift-v = 'join-with right'
alt-shift-b = 'join-with down'

alt-shift-f = "fullscreen"

# Close window (i3 style) — closes only the focused window; quits the app if it was its last window
alt-q = 'close --quit-if-last-window'

# ---------- Raycast ----------

# Open Raycast launcher
alt-d = 'exec-and-forget open -g "raycast://extensions/raycast/raycast/launcher"'

# Open Raycast clipboard history
alt-p = 'exec-and-forget open -g "raycast://extensions/raycast/clipboard-history/clipboard-history"'

alt-x = 'exec-and-forget alacritty -e zsh -lc "~/Scripts/readbook; "sleep 0.3'

# Launch Alacritty with tmux
# alt-enter = 'exec-and-forget open -na Alacritty --args -e tmux'

# Launch Alacritty 
alt-enter = 'exec-and-forget open -na Alacritty'

# Launch Firefox
alt-f = 'exec-and-forget open -na "Brave Browser" --args --new-window "https://archlinux.org/"'

# Launch Brave incognito window (plain incognito, never Tor)
#
# i for incognito. This used to be ctrl-shift-p, which had to go: that is the
# VS Code command palette on Windows/Linux, and Karabiner now translates it to
# cmd+shift+p.
#
# Karabiner runs BEFORE AeroSpace (it seizes the keyboard at the driver level
# and re-emits from a virtual one, which is what AeroSpace then sees). So once
# Karabiner rewrites ctrl+shift+p, AeroSpace never receives that chord and a
# binding on it here would be silently dead. Karabiner wins; anything AeroSpace
# needs to see must be a chord Karabiner does not touch.
alt-i = 'exec-and-forget open -na "Brave Browser" --args --incognito'

# Launch ranger
# ranger with no path arg reads the stale PWD env var (which launchd/open leaves
# as "/"), so it opened at root instead of home. Pass $HOME explicitly to fix it.
alt-n = 'exec-and-forget open -na Alacritty --args --working-directory "$HOME" -e ranger "$HOME"'

# Dismiss notification banners. killall NotificationCenter (the previous
# approach here) doesn't actually dismiss anything; it crash-restarts the
# renderer, which redraws whatever's still mid-flight and lets it finish its
# normal ~5s auto-hide countdown anyway, so it looked like a fix but wasn't.
# scripts/dismiss-notifications presses each banner's real Close/Clear action
# via System Events, same as clicking it. Needs Accessibility permission
# granted to AeroSpace.app (System Settings > Privacy & Security >
# Accessibility), since that's what spawns this via exec-and-forget; until
# granted this silently no-ops. Not a default macOS shortcut (verified before
# binding it).
#
# On alt-shift-x, not ctrl-shift-x: that is the VS Code Extensions view on
# Windows/Linux and Karabiner now translates it, which would leave a binding
# here dead. See the ordering note on alt-i above.
alt-shift-x = 'exec-and-forget $HOME/Scripts/dismiss-notifications'


# Dismiss ranger's dn drag window from anywhere, without focusing it first.
# The window closes itself once a drop lands, so this is for the leftovers: a
# fumbled drag, or launching it and changing your mind. It needs to be global
# because after dragging into another app that app holds focus, so a key sent
# to the drag window would never arrive.
#
# Escape closes it too, but only when it genuinely has focus. q is deliberately
# NOT bound inside the window: believing it is focused when ranger actually is
# would quit ranger.
#
# The pattern is the module path, not "python", so it cannot hit anything else.
#
# c for cancel. Not ctrl-shift-d: that is the VS Code Run and Debug view on
# Windows/Linux and Karabiner now translates it, which would leave a binding
# here dead. See the ordering note on alt-i above.
#
# Nor alt-shift-d, which this used to be. AeroSpace bindings are global and
# consume the chord, and alt-shift-d is Dark Reader's toggle in the browser,
# so this binding was silently eating it on both keyboards. Freed deliberately:
# a window-manager binding for a drag window that closes itself on drop is
# worth less than a shortcut used every day.
alt-shift-c = 'exec-and-forget pkill -f "drag-mac/drag_mac.py"'

# ---------- Workspaces ----------

alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'
alt-0 = 'workspace 10'

# Move window to workspace
alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'
alt-shift-6 = 'move-node-to-workspace 6'
alt-shift-7 = 'move-node-to-workspace 7'
alt-shift-8 = 'move-node-to-workspace 8'
alt-shift-9 = 'move-node-to-workspace 9'
alt-shift-0 = 'move-node-to-workspace 10'

[mode.resize.binding]
# Exit resize mode. i3 takes Return, Escape or mod+r.
enter = 'mode main'
esc = 'mode main'
alt-r = 'mode main'

# Same letters as the i3 resize mode, and the same directions on them: j and
# semicolon change width, k and l change height. i3 uses 10ppt steps; AeroSpace
# resizes in pixels, so 50 stands in.
j = 'resize width -50'          # shrink width
semicolon = 'resize width +50'  # grow width
k = 'resize height +50'         # grow height
l = 'resize height -50'         # shrink height

# i3 binds the arrows to the same four. Bare keys inside a mode, so no modifier
# and nothing for Karabiner to collide with.
left = 'resize width -50'
right = 'resize width +50'
down = 'resize height +50'
up = 'resize height -50'

# ---------- App Workspace Rules ----------

# Playwright's Firefox (apply-bot) carries this bundle id. Route it to
# workspace 9. move-node-to-workspace without --focus-follows-window never
# touches AeroSpace's own focused workspace, so this alone doesn't disturb
# your view. A prior version chained focus-back-and-forth here to counter
# what looked like a focus steal from the move — it wasn't: AeroSpace only
# remembers a single "previously focused window" slot (known upstream
# limitation, see nikitabobko/AeroSpace#1024), so that call was popping
# whatever window you'd last focused, unrelated to Firefox, every loop.sh
# cycle (~5 min). That's the random jump to Alacritty. macOS still briefly
# activates Firefox as the frontmost app on launch; that's handled in
# apply-bot's browser.py instead (the only place that can capture "what was
# frontmost right before launch").
[[on-window-detected]]
if.app-id = 'org.mozilla.nightly'
run = ['move-node-to-workspace 9']

# [[on-window-detected]]
# if.app-id = "org.mozilla.firefox"
# run = "move-node-to-workspace 2"
#
# [[on-window-detected]]
# if.app-id = "com.microsoft.Outlook"
# run = "move-node-to-workspace 4"
#
# Alacritty opened via `open -na Alacritty` (e.g. the alt-n ranger launcher) is a
# NEW instance, and AeroSpace tends to drop new-instance windows to floating.
# Force every Alacritty window back to the tiling layout.
[[on-window-detected]]
if.app-id = 'org.alacritty'
run = 'layout tiling'
