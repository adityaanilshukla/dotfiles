# Managed by dotfiles. Installed to /etc/lightdm/slick-greeter.conf by
# setup-lightdm.sh -- edit the repo, not this file.
#
# Captured from kalu on 2026-08-03, which is the login screen this setup
# mirrors. Unlike lightdm.conf, this file is owned by no package on either
# machine, so writing it directly costs nothing -- no .pacnew to reconcile.
#
# Key names are the gsettings keys of schema x.dm.slick-greeter. Values here
# override gsettings; a key absent here falls back to the schema default.
#
# NOTE: lightdm-settings (the GUI, installed on kalu) writes this same file.
# Using it creates drift that the next setup-lightdm.sh run will report as a
# diff. Change the repo instead, or re-run with FORCE=1 to discard the edit.

[Greeter]
# Must be a system path. The greeter runs as user `lightdm` -- nologin, home
# /var/lib/lightdm -- which cannot read /home/aditya, and /home is not
# guaranteed to be mounted this early. A path under $HOME renders a blank grey
# box. This differs from kalu's /usr/share/backgrounds/space-shuttle.jpg only in
# living under a dotfiles/ subdirectory, so it cannot collide with a
# package-owned wallpaper. The image is 3440x1440, a pixel-perfect fit for
# brovo's ultrawide and scaled down on kalu's laptop panel.
background=/usr/share/backgrounds/dotfiles/space-shuttle.jpg
stretch-background-across-monitors=false

# kalu does not set this and defaults to true, but true means slick-greeter
# prefers a per-user background from AccountsService and only falls back to
# `background` above. When AccountsService is unreachable it does not fall back
# to the file at all -- it renders flat `background-color` instead. That is
# exactly what happened under `lightdm --test-mode` here: a black screen with a
# perfectly valid wallpaper path sitting unused in the config.
#
# Neither machine has a /var/lib/AccountsService/users/aditya file, so pinning
# this to false renders identically to kalu today while removing the dependency
# on AccountsService being up at login. Deterministic beats matching a default.
draw-user-backgrounds=false

icon-theme-name=Qogir-Dark
cursor-theme-name=Bibata-Original-Classic
cursor-theme-size=20

# Deliberately NOT set:
#
#   theme-name  - kalu does not set it, so the greeter uses the default GTK
#     theme, and matching kalu is the point. Note this cannot be "Adwaita:dark"
#     (that is GTK_THEME env-var syntax, and the greeter does not inherit our
#     session environment) nor "AdwaitaDark" (that package ships gtk-2.0/ only;
#     see the note in x/xprofile). Either would silently render a LIGHT greeter.
#   xft-dpi     - kalu's laptop panel and brovo's 3440x1440 desktop have
#     different physical DPI. Pinning this is the one setting that would force
#     this file to be split per profile. Leave it to the greeter.
