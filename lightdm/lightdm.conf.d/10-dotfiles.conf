# Managed by dotfiles. Installed to /etc/lightdm/lightdm.conf.d/10-dotfiles.conf
# by setup-lightdm.sh -- edit the repo, not this file.
#
# This is a drop-in rather than an edit to /etc/lightdm/lightdm.conf because that
# file is a pacman `backup=` file. Managing it directly means reconciling a
# .pacnew on every lightdm upgrade, forever. A drop-in has no such cost.
#
# PRECEDENCE, and it is the reverse of systemd: LightDM reads
# lightdm.conf.d/*.conf FIRST and /etc/lightdm/lightdm.conf LAST, so the main
# file WINS. A key already set there cannot be overridden from here. That is
# fine on brovo and kalu, which already set greeter-session to the same value
# below, but it means this file is what makes a FRESH machine work, where
# lightdm.conf is pristine and both keys are commented out.
#
# Verify what actually took effect with:  lightdm --show-config

[Seat:*]
# Must match a .desktop in /usr/share/xgreeters/. If the named greeter is not
# installed, LightDM starts, finds nothing to draw, and leaves a black screen
# with no error. That is exactly the state brovo was in from 2025-12-13, when
# lightdm-slick-greeter was removed, and is the most likely thing to make
# "nvidia doesn't work with lightdm" look true again. setup-lightdm.sh treats a
# missing greeter .desktop as a fatal error for this reason.
greeter-session=lightdm-slick-greeter

# Arch's Xsession wrapper. It sources ~/.xprofile, which is where this setup's
# GTK_THEME and PATH come from; without it the session starts unthemed.
session-wrapper=/etc/lightdm/Xsession

# Deliberately NOT set:
#
#   logind-check-graphical - defaults to true, which is correct. It only
#     misbehaves when no DRM node is tagged master-of-seat, i.e. when
#     nvidia_drm modeset is off -- fix that instead. Setting it false is the
#     cargo-culted NVIDIA workaround and trades a black screen for a race
#     against DRM being ready.
#   minimum-vt             - the default of 7 keeps LightDM off tty1 where
#     getty lives. Lowering it is a documented security issue (FS#46799).
#   display-setup-script   - no xrandr needed. Both machines are single-head,
#     and nvidia's shipped 10-nvidia-drm-outputclass.conf already sets
#     AllowEmptyInitialConfiguration.
#   user-session           - kalu does not set it, and matching kalu is the
#     point. Both machines carry i3.desktop and i3-with-shmlog.desktop in
#     /usr/share/xsessions; LightDM remembers the last session per user in
#     /var/lib/lightdm/, so this only ever matters on a first login. Set it to
#     `i3` here if that first login ever picks the shmlog variant.
