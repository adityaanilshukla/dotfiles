# The font size is NOT set here. It lives in the imported file below, which
# scripts/alacritty-font-size regenerates to suit whichever screen is attached:
# the built-in display and the ultrawide want very different numbers, and the
# gap is big enough that the wrong one is unusable rather than just annoying.
#
# It has to be an import rather than a value here, because an importing file
# wins over everything it imports. Verified: with `size = 20` here and 15 in
# the import, the window came up at 20. So a size here would silently make the
# generated file dead weight.
#
# Alacritty watches imported files too, not just this one, so a regenerated
# file re-sizes every window already open, no restart. Also verified: editing
# only the import took a running window from 11 to 15.
#
# If the generated file is missing, alacritty skips it and falls back to its
# own default of 11.25, which is tiny. install.sh writes it, and sketchybar
# regenerates it at every startup, so that state does not last. Regenerate by
# hand any time with: alacritty-font-size
[general]
import = ["~/.config/alacritty/font-size.toml"]

[font.normal]
family = "Hack Nerd Font"
style = "Regular"

[font.bold]
family = "Hack Nerd Font"
style = "Bold"

[font.italic]
family = "Hack Nerd Font"
style = "Italic"

[window]
# opacity = 0.95
decorations = "None"

[bell]
command = "None"

# Ctrl+Shift+C / Ctrl+Shift+V: the Linux terminal copy and paste pair.
# Alacritty ships these on every platform EXCEPT macOS, where the defaults are
# Cmd+C / Cmd+V, same story as the font zoom below. Karabiner cannot supply
# them either: its letter remaps live in the "gui" scope, which excludes
# terminals so that plain Ctrl+C stays a real SIGINT rather than becoming
# Cmd+C. Shift is what separates the two: Ctrl+C interrupts, Ctrl+Shift+C
# copies. Cmd+C / Cmd+V keep working.
#
# (Ctrl+Shift+C was previously bound here to send SIGINT, which was redundant
# with plain Ctrl+C and cost the copy binding. This is that slot put to use.)
[[keyboard.bindings]]
key = "C"
mods = "Control|Shift"
action = "Copy"

[[keyboard.bindings]]
key = "V"
mods = "Control|Shift"
action = "Paste"

[[keyboard.bindings]]
key = "Back"
mods = "Control"
chars = "\u0017" # Ctrl+Backspace = delete word

# Ctrl-based font zoom, matching the Linux/Windows defaults. Alacritty ships
# these bound to Control on every platform EXCEPT macOS, where the defaults are
# Cmd+= / Cmd+- / Cmd+0 instead (alacritty-bindings(5), "macOS only" section).
# Karabiner cannot supply them: its zoom rules are in the "gui" scope, which
# excludes terminals on purpose, and font size is the terminal's own business
# rather than something to fake with a Cmd chord. Declared here instead, which
# restores the Arch muscle memory. The Cmd+ versions keep working too.
[[keyboard.bindings]]
key = "="
mods = "Control"
action = "IncreaseFontSize"

[[keyboard.bindings]]
key = "+"
mods = "Control"
action = "IncreaseFontSize"

[[keyboard.bindings]]
key = "-"
mods = "Control"
action = "DecreaseFontSize"

[[keyboard.bindings]]
key = "0"
mods = "Control"
action = "ResetFontSize"

[env]
TERM = "xterm-256color"
WINIT_X11_SCALE_FACTOR = "1.50"

[colors.primary]
background = "0x161718"
foreground = "0xc4c8c5"

[colors.cursor]
text = "0x161718" # selection_foreground
# cursor = "0xd0d0d0"
cursor = "0x4da3ff"

[colors.selection]
text = "0x161718"       # selection_foreground
background = "0x444444"

[colors.normal]
black = "0x3c3c3c"   # color0 — bumped from 0x000000
red = "0xfc5ef0"     # color1
green = "0x86c38a"   # color2
yellow = "0xffd6b1"  # color3
blue = "0x85befd"    # color4
magenta = "0xb9b5fc" # color5
cyan = "0x85befd"    # color6
white = "0xdfdfdf"   # color7


[colors.bright]
black = "0xaaaaaa"
red = "0xfc5ef0"     # color9
green = "0x94f936"   # color10
yellow = "0xf5ffa7"  # color11
blue = "0x95cbfe"    # color12
magenta = "0xb9b5fc" # color13
cyan = "0x85befd"    # color14
white = "0xdfdfdf"   # color15
