# Force the working dark theme for the GTK portal backend.
#
# xdg-desktop-portal-gtk draws the file chooser that GTK apps and Firefox open.
# It is a systemd/D-Bus activated service, so it does NOT inherit GTK_THEME from
# the X session -- it inherits the systemd user manager's environment, which PAM
# seeds from /etc/environment. That file still carries GTK_THEME=Adwaita-dark,
# a name GTK3 does not resolve, so the portal fell back to light while every
# session-started app was correctly dark.
#
# Setting it on the unit removes the dependency on environment propagation
# entirely, and needs no root, unlike editing /etc/environment.
#
# "Adwaita:dark" is theme:variant syntax. Do not use "Adwaita-dark" or
# "AdwaitaDark"; neither resolves on GTK 3.24.52 and both render light.
[Service]
Environment=GTK_THEME=Adwaita:dark
