# Use Vim-style copy mode
setw -g mode-keys vi

# copy buffer without leaving copy mode
bind-key -T copy-mode-vi y send-keys -X copy-selection

# Copy mode on one chord. prefix [ is C-b then [, which is two chords with a
# modifier release in the middle, and it is the single most-reached-for binding
# here - scrolling back over what Claude Code just printed. C-Space is one
# press and toggles: it enters copy mode, and the copy-mode-vi binding below
# leaves it again.
#
# Why C-Space and not something more mnemonic. Alt is unavailable: alacritty
# leaves option_as_alt unset, so Option sends no Meta and every M- binding
# would be dead on arrival. Ctrl+Shift+letter is unavailable too - a terminal
# cannot distinguish it from plain Ctrl+letter without extended keys, which
# would mean turning on CSI-u here and in alacritty for the sake of one
# binding. C-Space needs neither, and is the same physical chord on both
# keyboards: the Glove80 group in karabiner/spec.json swaps Command and Option
# but leaves Control alone, and Karabiner's `gui` scope excludes terminals, so
# the chord arrives here raw either way.
#
# What it costs: tmux swallows the key before the pane sees it, so Neovim loses
# <C-@> (insert last inserted text) and zsh in emacs mode loses set-mark. Both
# are cheap next to reaching copy mode.
bind -n C-Space copy-mode
bind -T copy-mode-vi C-Space send-keys -X cancel

# prefix Z is copy-mode with the pane zoomed first, unzooming on the way out.
# prefix [ is left stock, because zooming necessarily hides the sibling pane and
# that is not what you want every time you scroll.
#
# tmux clips scrollback when a pane narrows and never reflows it, so in a split
# window every line printed while the pane was wider is cut off on the right.
# Measured: a 180-column line reads 102 in a 101-column pane, and 203 again once
# zoomed. The cells survive, they are only off-pane, so zooming first is the
# whole fix. Nothing else reaches them: copy-mode has no horizontal scroll.
#
# This bites hardest with Claude Code, whose tables are drawn to the pane width
# at print time and then read back later, after the window has been split.
#
# The @zoomed-for-copy flag is why the unzoom only undoes zooms this binding
# performed. A pane you zoomed yourself with prefix z is left zoomed.
bind Z if-shell -F '#{||:#{window_zoomed_flag},#{==:#{window_panes},1}}' \
         'copy-mode' \
         'set -w @zoomed-for-copy 1 ; resize-pane -Z ; copy-mode'

# resize-pane -Z is a toggle, so the unzoom is guarded on the window still being
# zoomed. Without that guard, unzooming by hand while in copy-mode and then
# leaving it would zoom the pane instead of restoring the split. The flag is
# cleared either way, so a stale one can never fire later.
set-hook -g pane-mode-changed \
  "if-shell -F '#{&&:#{==:#{pane_mode},},#{==:#{@zoomed-for-copy},1}}' \
     'set -uw @zoomed-for-copy ; if-shell -F \"#{window_zoomed_flag}\" \"resize-pane -Z\"'"

# Copy mode's colours, split by job rather than shared.
#
# Both of these used to come from mode-style, whose default was bg=yellow --
# the palette WORD, which alacritty.toml maps to #ffd6b1. tmux 3.8 swapped the
# word for its own themeyellow, which resolves to darkgoldenrod (#b8860b) on a
# 256-colour client. That is hue 43 at 94% saturation, and nothing else in the
# alacritty palette is warm or that saturated: its colours sit at hues 209-212,
# 243 and 305. The goldenrod looked foreign because it is.
#
# #b9b5fc is the replacement because it is the one colour alacritty.toml sets
# twice, identically, as both normal and bright magenta -- a deliberate choice
# rather than a leftover default. At hue 243 it belongs to that violet-blue
# family while staying clear of the blues at ~210, which matters here: the
# status line is already lightblue and the asterisk is #4da3ff, so a blue
# highlight would read as more status chrome instead of as a mode.
#
# Split because the two have opposite needs. The position indicator is a few
# characters in the corner and should be noticed, so it gets the full colour
# with dark text. The selection can cover half a screen of scrollback, where
# a saturated block is tiring to read through -- so it gets a tinted panel at
# hue 248, beside the lavender, and keeps the pane's own foreground. That is
# the same restraint as alacritty.toml's neutral grey selection background,
# moved off grey and onto this theme's axis.
setw -g copy-mode-position-style  bg=#b9b5fc,fg=#161718
setw -g copy-mode-selection-style bg=#413d5c

# mode-style is the fallback for every other window mode, and the two options
# above no longer read it -- so what it actually governs now is tree mode, the
# window and session list on prefix w and prefix s, via
# tree-mode-selection-style. Left at its 3.8 default that list stayed
# goldenrod after copy mode had moved on.
#
# The full colour rather than the panel, because tree mode selects one line of
# a list: it is the indicator case, not the block-of-scrollback case.
setw -g mode-style bg=#b9b5fc,fg=#161718

# The last three places 3.8 put themeyellow, none of which read mode-style.
#
# menu-selected-style is the highlighted row in the prefix < and prefix > menus
# (and the same menus on a right-click, since mouse is on). The mark style is
# the line X lands on in copy mode. The current-line-number style only shows
# with copy-mode-line-numbers on, which is off here, but it is set anyway so
# turning that on later does not reintroduce the gold.
#
# All three are landmark-or-cursor cases rather than blocks of text, so they
# take the full colour like the position indicator, not the dim panel.
set  -g menu-selected-style                 bg=#b9b5fc,fg=#161718
setw -g copy-mode-mark-style                bg=#b9b5fc,fg=#161718
setw -g copy-mode-current-line-number-style fg=#b9b5fc

# The command prompt (prefix :) and every display-message, including the
# "config reloaded" one from prefix r below. These two are not a plain style:
# the trailing conditional fills the rest of the status line with the message
# background unless the prompt is a pane or mode prompt, so they are the 3.8
# defaults with the two theme colours substituted rather than rewritten, to
# keep that behaviour intact.
set -g message-style 'bg=#b9b5fc,fg=#161718,#{?#{m/r:(^|#,)IS(PANE|MODE)($|#,),#{prompt_flags}},,fill=#b9b5fc}'
set -g message-command-style 'bg=#161718,fg=#b9b5fc,#{?#{m/r:(^|#,)IS(PANE|MODE)($|#,),#{prompt_flags}},,fill=#161718}'

set-option -g status-style "bg=#000000,fg=lightblue"
set-option -g pane-border-style fg=grey

# The active pane's border is the same grey as every other border, on purpose:
# moving between panes should not repaint anything. The line stays rather than
# being deleted, because deleting it does not mean "no highlight" -- it hands
# the option back to a tmux default that is a conditional, green normally and
# themeyellow whenever the pane is in copy mode, so removing it would bring
# back both a highlight and the gold this file has just finished removing.
set-option -g pane-active-border-style fg=grey
set-option -g focus-events on

# Session number, hard left, no divider
set -g status-left " #S "

# Window list: drop the "index:" colon, keep the number for prefix-<n> jumps.
# The active window is marked with a colored asterisk.
set -g window-status-separator ""
setw -g window-status-format " #I #W "
setw -g window-status-current-format " #I #W#[fg=#4da3ff]* "

# No underline on the active window. tmux 3.8 changed the default for this
# option from `default` to `underscore`, so the 3.8 upgrade stacked an
# underline on top of the asterisk above -- two markers for the same window,
# one of them never asked for. The asterisk is the one this file chose, so the
# inherited one is turned off rather than lived with.
#
# `default` rather than `noattr` or `none`: tmux reads `default` here as "fall
# through to window-status-style", which in turn falls through to status-style,
# so the active window keeps picking up any future change to those two instead
# of being pinned to a style of its own.
setw -g window-status-current-style default

# Right side: host, time, day-of-week date
set -g status-right "#H %H:%M %a %d-%b "

set -g default-terminal "tmux-256color"
set -as terminal-overrides ',xterm-256color:Tc'

# Pass undercurl (and its color) through to the outer terminal so nvim's
# spell/diagnostic squiggles render properly.
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

#set buffer size
set -g history-limit 20000

# make tmux pass keys mor reliably
set -g xterm-keys on

# Plugins. These are declared BEFORE tpm runs, and that ordering is the whole
# point: tpm reads @plugin at the moment it is sourced, so a `run` line placed
# above these sees an empty list and installs nothing. The tpm call lives at the
# very bottom of this file for that reason.
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Auto-save stays on so a snapshot always exists. Auto-restore is deliberately
# OFF: with it on, a plain `tmux` rebuilds the last saved session instead of
# giving you an empty one, which is not what that command should do. Restore
# when you actually want it, with prefix C-r.
set -g @continuum-restore 'off'
set -g @resurrect-strategy-nvim 'session'

# Optional: save every 15 mins
set -g @continuum-save-interval '15'

# Start windows and panes at index 1
set -g base-index 1
setw -g pane-base-index 1

bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded!"

# Initialize TPM. Every @plugin and every plugin @option has to be set before
# it runs, which is why it sits down here. install.sh clones tpm and runs its
# install_plugins, so a fresh machine needs no prefix+I by hand.
run '~/.tmux/plugins/tpm/tpm'

# Manual save and restore for tmux-resurrect, with a confirmation message.
# These come AFTER the tpm call on purpose. resurrect binds plain prefix C-s and
# prefix C-r itself when it loads, so anything above would just be overwritten
# and the "Resurrect saved!" feedback would silently disappear.
bind C-s run-shell '~/.tmux/plugins/tmux-resurrect/scripts/save.sh && tmux display-message "Resurrect saved!"'
bind C-r run-shell '~/.tmux/plugins/tmux-resurrect/scripts/restore.sh && tmux display-message "Resurrect restored!"'
