# Use Vim-style copy mode
setw -g mode-keys vi

bind-key -T copy-mode-vi y send-keys -X copy-selection

# Copy mode's colours, and every other surface tmux 3.8 painted gold.
#
# These used to come from mode-style, whose default was bg=yellow -- the palette
# WORD, which alacritty.toml maps to #ffd6b1. 3.8 swapped the word for its own
# themeyellow, resolving to darkgoldenrod (#b8860b) on a 256-colour client. That
# is hue 43 at 94% saturation, and nothing else in the alacritty palette is warm
# or that saturated: its colours sit at hues 209-212, 243 and 305. The goldenrod
# looked foreign because it is.
#
# #b9b5fc is the replacement because it is the one colour alacritty.toml sets
# twice, identically, as both normal and bright magenta -- a deliberate choice
# rather than a leftover default. At hue 243 it belongs to that violet-blue
# family while staying clear of the blues at ~210, which matters here: the status
# line is already lightblue and the asterisk below is #4da3ff, so a blue
# highlight would read as more status chrome instead of as a mode.
#
# Split by job, because these have opposite needs. The position indicator, the
# tree-mode row (prefix w and prefix s), the copy-mode mark (X), the menu
# selection (prefix < and prefix >) and the command prompt are all landmarks or
# cursors, so they take the full colour with dark text. The selection can cover
# half a screen of scrollback, where a saturated block is tiring to read through
# -- so it gets a tinted panel at hue 248, beside the lavender, and keeps the
# pane's own foreground. That is the same restraint as alacritty.toml's neutral
# grey selection background, moved off grey and onto this theme's axis.
setw -g copy-mode-position-style  bg=#b9b5fc,fg=#161718
setw -g copy-mode-selection-style bg=#413d5c

# mode-style is the fallback for every other window mode, and the two options
# above no longer read it -- so what it governs now is tree mode, the window and
# session list on prefix w and prefix s, via tree-mode-selection-style.
setw -g mode-style bg=#b9b5fc,fg=#161718

# The remaining three. current-line-number-style only shows with
# copy-mode-line-numbers on, which is off by default, but it is set anyway so
# turning that on later does not reintroduce the gold.
set  -g menu-selected-style                 bg=#b9b5fc,fg=#161718
setw -g copy-mode-mark-style                bg=#b9b5fc,fg=#161718
setw -g copy-mode-current-line-number-style fg=#b9b5fc

# The command prompt (prefix :) and every display-message, including the "config
# reloaded" one from prefix r at the bottom of this file. These two are not a
# plain style: the trailing conditional fills the rest of the status line with
# the message background unless the prompt is a pane or mode prompt, so they are
# the 3.8 defaults with the two theme colours substituted rather than rewritten,
# to keep that behaviour intact.
set -g message-style 'bg=#b9b5fc,fg=#161718,#{?#{m/r:(^|#,)IS(PANE|MODE)($|#,),#{prompt_flags}},,fill=#b9b5fc}'
set -g message-command-style 'bg=#161718,fg=#b9b5fc,#{?#{m/r:(^|#,)IS(PANE|MODE)($|#,),#{prompt_flags}},,fill=#161718}'
#
# Left alone deliberately: copy-mode-match-style and copy-mode-current-match-
# style, which 3.8 gives themecyan and thememagenta. Both are already inside
# this palette's hue range, and search hits want to be unlike the selection they
# sit in.

set-option -g status-style "bg=#000000,fg=lightblue"
set-option -g pane-border-style fg=grey
# The active pane's border is the same grey as every other border, on purpose:
# moving between panes should not repaint anything. The line stays rather than
# being deleted, because deleting it does not mean "no highlight" -- it hands the
# option back to a tmux 3.8 default that is a conditional, green normally and
# themeyellow whenever the pane is in copy mode, so removing it would bring back
# both a highlight and the gold this file removes above.
set-option -g pane-active-border-style fg=grey
set-option -g focus-events on

# Session number, hard left, no divider
set -g status-left " #S "

# Window list: drop the "index:" colon, keep the number for prefix-<n> jumps.
# The active window is marked with a colored asterisk.
set -g window-status-separator ""
setw -g window-status-format " #I #W "
setw -g window-status-current-format " #I #W#[fg=#4da3ff]* "

# No underline on the active window. tmux 3.8 changed the default for this
# option from `default` to `underscore`, so the upgrade stacked an underline on
# top of the asterisk above -- two markers for the same window, one of them
# never asked for. The asterisk is the one this file chose.
#
# `default` rather than `noattr` or `none`: tmux reads `default` here as "fall
# through to window-status-style", which in turn falls through to status-style,
# so the active window keeps picking up any future change to those two instead
# of being pinned to a style of its own.
setw -g window-status-current-style default

# Right side: host, time, day-of-week date
set -g status-right "#H %H:%M %a %d-%b "

#alt buffer, no idea what this means
set -g terminal-overrides 'xterm*:smcup@:rmcup@'

set -g default-terminal "tmux-256color"
set -as terminal-overrides ',xterm-256color:Tc'

# Pass undercurl (and its color) through to the outer terminal so nvim's
# spell/diagnostic squiggles render properly.
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

#set buffer size
set -g history-limit 20000

# make tmux pass keys mor reliably
set -g xterm-keys on

# Initialize TPM
run '~/.tmux/plugins/tpm/tpm'

# Plugins
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Auto-save + auto-restore on tmux start
set -g @continuum-restore 'on'
set -g @resurrect-strategy-nvim 'session'

# Optional: save every 15 mins
set -g @continuum-save-interval '15'

# Manual save and restore bindings for tmux-resurrect
bind C-s run-shell '~/.tmux/plugins/tmux-resurrect/scripts/save.sh && tmux display-message "Resurrect saved!"'
bind C-r run-shell '~/.tmux/plugins/tmux-resurrect/scripts/restore.sh && tmux display-message "Resurrect restored!"'

# Start windows and panes at index 1
set -g base-index 1
setw -g pane-base-index 1

bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded!"
